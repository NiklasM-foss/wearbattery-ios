name: WearBattery
options:
  bundleIdPrefix: de.wearbattery
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WearBattery:
    type: application
    platform: iOS
    sources: [App, Shared]
    entitlements:
      path: App/WearBattery.entitlements
      properties:
        com.apple.security.application-groups: [group.de.wearbattery]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Uhr-Akku
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: Die App liest den Akkustand und die Gesundheitsdaten deiner Uhr per Bluetooth.
        NSHealthShareUsageDescription: Die App liest keine Health-Daten.
        NSHealthUpdateUsageDescription: Die App schreibt Puls, Schritte, Strecke und Kalorien deiner Uhr nach Apple Health.
        UIBackgroundModes: [bluetooth-central]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.wearbattery.app
    dependencies:
      - target: BatteryWidget
  BatteryWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    entitlements:
      path: Widget/BatteryWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.de.wearbattery]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Uhr-Akku
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.wearbattery.app.widget
